name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK Directly
        run: gradle assembleDebug --stacktrace

      - name: Run Unit Tests
        run: gradle testDebugUnitTest || true

      - name: Prepare APK for Direct Download
        run: |
          cp app/build/outputs/apk/debug/*.apk GlipDriver.apk

      - name: Upload APK to Artifacts (Direct File)
        uses: actions/upload-artifact@v4
        with:
          name: GlipDriver-Direct-APK
          path: GlipDriver.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-demo
          name: "Glip Driver Demo APK (Direct Download)"
          body: |
            ### 🚗 Glip Driver — Android MVP
            - **Direct APK Download**: Tap `GlipDriver.apk` below on your mobile to download directly (No zip extraction needed).
            - Built with Jetpack Compose & Material 3.
          files: GlipDriver.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
