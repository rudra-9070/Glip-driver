name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK for Easy Direct Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GlipDriver.apk

      - name: Upload to GitHub Releases (Direct .apk Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Glip Driver Latest APK (Direct Download)"
          body: |
            ### 🚗 Glip Driver — Android MVP Build
            - Direct download link below (No Zip extraction needed!)
            - Tap **GlipDriver.apk** on your mobile to download and install directly.
            - Built automatically from latest commit on `main`.
          files: GlipDriver.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
