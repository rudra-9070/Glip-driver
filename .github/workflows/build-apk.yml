name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Show Detailed Error if Build Failed
        if: failure()
        run: |
          echo "==== ERROR SUMMARY ===="
          grep -iE "e: |error:|exception:" -B 2 -A 8 build.log || true
          echo "==== LAST 80 LINES OF BUILD LOG ===="
          tail -n 80 build.log

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue || true

      - name: Prepare APK for Direct Download
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found in app/build/outputs/apk"
            find app/build -type f -name "*.apk"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" GlipDriver.apk
          ls -lh GlipDriver.apk

      - name: Upload APK to Artifacts (Direct File)
        uses: actions/upload-artifact@v4
        with:
          name: GlipDriver-Direct-APK
          path: GlipDriver.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-demo
          name: "Glip Driver Demo APK (Direct Download)"
          body: |
            ### 🚗 Glip Driver — Android MVP
            - **Direct APK Download**: Tap `GlipDriver.apk` below on your mobile to download directly (No zip extraction needed).
            - Built with Jetpack Compose & Material 3.
          files: GlipDriver.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
